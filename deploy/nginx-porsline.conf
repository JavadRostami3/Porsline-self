server {
    listen 80;
    listen [::]:80;
    server_name porsline.littlejay.tech;

    root /var/www/survey-app/artifacts/survey-app/dist/public;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/survey-app/artifacts/survey-app/dist/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name porsline.littlejay.tech;

    ssl_certificate /etc/letsencrypt/live/porsline.littlejay.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/porsline.littlejay.tech/privkey.pem;

    root /var/www/survey-app/artifacts/survey-app/dist/public;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
