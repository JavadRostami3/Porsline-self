name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public homepage through Cloudflare
        run: curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 --output /dev/null https://porsline.littlejay.tech/

      - name: Check public API health through Cloudflare
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 20 https://porsline.littlejay.tech/api/healthz)"
          test "$body" = '{"status":"ok"}'
